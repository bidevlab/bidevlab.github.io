<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>SmartKis — Reset your password</title>
<!--
  The password reset, for a browser.

  A custom URL scheme only resolves on a device where the app is installed, so
  `smartkis://reset-password` is a dead link on the desktop where a great many
  people read their email. This page is the answer: it completes the reset
  itself, on any device, and needs no app at all.

  It accepts the token two ways, because the link can be built two ways and
  both should land here:

    ?token_hash=...&type=recovery      the mail template's own token (verifyOtp)
    #access_token=...&refresh_token=.. a redirect_to hand-off (setSession)

  The key below is the *publishable* key. It is public by design, is already
  inside the App Store binary, and every table it can reach sits behind RLS.

  Nothing persists: the client is told not to write a session to storage and
  not to read one out of the URL behind our back, and the page signs out the
  moment the password is changed — so a shared or borrowed computer is never
  left holding a live session.
-->
<style>
  :root {
    --bg:#F6F3EC; --surface:#FFFFFF; --ink:#15140F; --ink-soft:#6B6659;
    --ink-faint:#A49E8E; --gold:#E0AE38; --gold-deep:#C08D1E;
    --income:#2E8F63; --expense:#C4483F; --line:rgba(21,20,15,0.07);
    --line-strong:rgba(21,20,15,0.12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:420px; background:var(--surface); border-radius:20px;
    border:1px solid var(--line); padding:28px 24px 24px;
    box-shadow:0 18px 48px rgba(21,20,15,0.08);
  }
  /* The lockup, matching src/components/Logo.tsx: the mark leads, the wordmark
     follows. In Hebrew the flex row reverses on its own, which puts the mark on
     the right exactly as `d.row` does in the app. */
  .brand { display:flex; align-items:center; gap:12px; margin:0 0 20px; }
  .brand svg { width:46px; height:46px; flex:none; }
  .wordmark {
    font-size:24px; font-weight:700; letter-spacing:-0.6px; color:var(--ink);
    /* A Latin wordmark stays LTR in both languages. */
    direction:ltr;
  }
  h1 { font-size:24px; line-height:1.25; letter-spacing:-0.4px; margin:0 0 8px; }
  p.lead { color:var(--ink-soft); margin:0 0 20px; font-size:15px; }
  label { display:block; font-size:13px; color:var(--ink-soft); margin:0 0 6px; }
  .field { margin:0 0 14px; position:relative; }
  input[type=password], input[type=text] {
    width:100%; padding:13px 14px; font-size:16px; font-family:inherit;
    border:1.5px solid var(--line-strong); border-radius:12px; background:#FBF9F5;
    color:var(--ink);
    /* A password is an LTR island in both languages, as it is in the app. */
    direction:ltr; text-align:left;
  }
  input:focus { outline:none; border-color:var(--gold); background:#fff; }
  .reveal {
    position:absolute; inset-inline-end:10px; top:30px; border:0; background:none;
    color:var(--ink-faint); font-size:12px; cursor:pointer; padding:6px;
  }
  ul.rules { list-style:none; margin:0 0 18px; padding:0; font-size:13px; }
  ul.rules li { color:var(--ink-faint); padding:2px 0; }
  ul.rules li.ok { color:var(--income); }
  ul.rules li::before { content:"\25CB  "; }
  ul.rules li.ok::before { content:"\25CF  "; }
  button.primary {
    width:100%; padding:15px; font-size:16px; font-weight:600; font-family:inherit;
    color:#15140F; background:linear-gradient(135deg,#F6D67A,#E0AE38);
    border:0; border-radius:14px; cursor:pointer;
  }
  button.primary[disabled] { opacity:.5; cursor:default; }
  .note { font-size:13px; color:var(--ink-faint); margin:16px 0 0; }
  .bad { color:var(--expense); }
  .hidden { display:none !important; }
  a.applink {
    display:block; text-align:center; margin:14px 0 0; padding:13px;
    border:1.5px solid var(--line-strong); border-radius:14px;
    color:var(--gold-deep); text-decoration:none; font-weight:600; font-size:15px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 100 100" role="img" aria-label="SmartKis">
      <defs>
        <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#5EEAD4" /><stop offset="1" stop-color="#0D9488" />
        </linearGradient>
        <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#A5B4FC" /><stop offset="1" stop-color="#4F46E5" />
        </linearGradient>
        <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F6D67A" /><stop offset="0.5" stop-color="#E0AE38" />
          <stop offset="1" stop-color="#C08D1E" />
        </linearGradient>
        <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000000" stop-opacity="0.02" />
          <stop offset="1" stop-color="#000000" stop-opacity="0.16" />
        </linearGradient>
        <clipPath id="wallet"><rect x="6" y="34" width="88" height="52" rx="17" /></clipPath>
      </defs>

      <!-- the two cards, fanned, behind the wallet -->
      <g transform="rotate(-14 34 27)">
        <rect x="11" y="10" width="46" height="34" rx="8" fill="url(#cardA)" />
        <rect x="16" y="31" width="36" height="3" rx="2" fill="#FFFFFF" fill-opacity="0.55" />
      </g>
      <g transform="rotate(11 58 24)">
        <rect x="35" y="7" width="46" height="34" rx="8" fill="url(#cardB)" />
        <rect x="40" y="28" width="36" height="3" rx="2" fill="#FFFFFF" fill-opacity="0.55" />
      </g>

      <!-- the wallet: gold leather, a deeper front flap, a dark clasp -->
      <g clip-path="url(#wallet)">
        <rect x="6" y="34" width="88" height="52" fill="url(#leather)" />
        <rect x="6" y="50" width="88" height="36" rx="10" fill="url(#flap)" />
      </g>
      <rect x="70" y="58" width="17" height="12" rx="6" fill="#15140F" />
    </svg>
    <span class="wordmark">SmartKis</span>
  </div>

  <div id="stage-loading">
    <h1 data-t="checking"></h1>
    <p class="lead" data-t="checkingBody"></p>
  </div>

  <div id="stage-error" class="hidden">
    <h1 data-t="deadTitle"></h1>
    <p class="lead" data-t="deadBody"></p>
    <p class="note" id="errDetail"></p>
  </div>

  <div id="stage-form" class="hidden">
    <h1 data-t="title"></h1>
    <p class="lead" id="forWhom"></p>

    <form id="form" autocomplete="off">
      <div class="field">
        <label for="pw" data-t="newPassword"></label>
        <input id="pw" type="password" autocomplete="new-password" required />
        <button type="button" class="reveal" id="reveal" data-t="show"></button>
      </div>

      <ul class="rules" id="rules">
        <li data-rule="length"></li>
        <li data-rule="lower"></li>
        <li data-rule="upper"></li>
        <li data-rule="digit"></li>
      </ul>

      <div class="field">
        <label for="pw2" data-t="confirm"></label>
        <input id="pw2" type="password" autocomplete="new-password" required />
      </div>

      <button class="primary" id="submit" type="submit" disabled data-t="save"></button>
      <p class="note bad hidden" id="formError"></p>
    </form>
  </div>

  <div id="stage-done" class="hidden">
    <h1 data-t="doneTitle"></h1>
    <p class="lead" data-t="doneBody"></p>
    <a class="applink hidden" id="openApp" href="smartkis://" data-t="openApp"></a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://hsdzyvlytqfhbcygbmrd.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_EfvhJGXO5k-Y4vREvYIPTw_DWjEXrAm';

/* Both languages, as the app has. Hebrew reads right-to-left. */
const STRINGS = {
  en: {
    checking: 'One moment',
    checkingBody: 'Checking your reset link.',
    deadTitle: 'This link has expired',
    deadBody: 'Reset links work once and they do not last long. Open SmartKis, tap "Forgot your password?", and we will send a fresh one.',
    title: 'Choose a new password',
    save: 'Save new password',
    newPassword: 'New password',
    confirm: 'Repeat it',
    show: 'Show',
    hide: 'Hide',
    forWhom: (e) => 'Signing in as ' + e,
    length: 'At least 8 characters',
    lower: 'A lowercase letter',
    upper: 'A capital letter',
    digit: 'A number',
    mismatch: 'The two passwords are not the same.',
    common: 'That password is too easy to guess. Try something less common.',
    failed: 'We could not change the password. Ask for a fresh link and try again.',
    doneTitle: 'Password changed',
    doneBody: 'Sign in to SmartKis with your new password. You can close this page.',
    openApp: 'Open SmartKis',
  },
  he: {
    checking: 'רגע אחד',
    checkingBody: 'בודקים את קישור האיפוס.',
    deadTitle: 'הקישור הזה כבר לא בתוקף',
    deadBody: 'קישור לאיפוס תקף לשימוש אחד בלבד ולזמן קצר. פתחו את SmartKis, לחצו על "שכחתם סיסמה?" ונשלח קישור חדש.',
    title: 'בחרו סיסמה חדשה',
    save: 'שמירת הסיסמה',
    newPassword: 'סיסמה חדשה',
    confirm: 'הקלידו שוב',
    show: 'הצג',
    hide: 'הסתר',
    forWhom: (e) => 'מתחברים בתור ' + e,
    length: 'לפחות 8 תווים',
    lower: 'אות קטנה באנגלית',
    upper: 'אות גדולה באנגלית',
    digit: 'ספרה',
    mismatch: 'שתי הסיסמאות אינן זהות.',
    common: 'הסיסמה הזו קלה מדי לניחוש. בחרו משהו פחות שכיח.',
    failed: 'לא הצלחנו לשנות את הסיסמה. בקשו קישור חדש ונסו שוב.',
    doneTitle: 'הסיסמה הוחלפה',
    doneBody: 'אפשר להתחבר ל־SmartKis עם הסיסמה החדשה. אפשר לסגור את הדף.',
    openApp: 'פתיחת SmartKis',
  },
};

const he = (navigator.language || 'en').toLowerCase().startsWith('he');
const t = he ? STRINGS.he : STRINGS.en;
if (he) {
  document.documentElement.lang = 'he';
  document.documentElement.dir = 'rtl';
}
for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];
for (const el of document.querySelectorAll('[data-rule]')) el.textContent = t[el.dataset.rule];

/* The four rules the app makes required, and the same blocklist. */
const RULES = {
  length: (v) => v.length >= 8,
  lower: (v) => /[a-z]/.test(v),
  upper: (v) => /[A-Z]/.test(v),
  digit: (v) => /\d/.test(v),
};
const BLOCKLIST = ['password', 'passw0rd', '12345678', '123456789', 'qwerty',
  'qwerty123', 'abc12345', 'iloveyou', 'admin123', 'welcome1', 'letmein', 'monkey123'];

const show = (id) => {
  for (const s of ['loading', 'error', 'form', 'done']) {
    document.getElementById('stage-' + s).classList.toggle('hidden', s !== id);
  }
};
const fail = (detail) => {
  show('error');
  if (detail) document.getElementById('errDetail').textContent = detail;
};

const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
});

async function authorise() {
  const query = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.slice(1));

  const tokenHash = query.get('token_hash');
  if (tokenHash) {
    const { error } = await supabase.auth.verifyOtp({
      type: query.get('type') || 'recovery',
      token_hash: tokenHash,
    });
    return error ? { ok: false, message: error.message } : { ok: true };
  }

  const access_token = hash.get('access_token');
  const refresh_token = hash.get('refresh_token');
  if (access_token && refresh_token) {
    const { error } = await supabase.auth.setSession({ access_token, refresh_token });
    return error ? { ok: false, message: error.message } : { ok: true };
  }

  return {
    ok: false,
    message: hash.get('error_description') || query.get('error_description') || '',
  };
}

const pw = document.getElementById('pw');
const pw2 = document.getElementById('pw2');
const submit = document.getElementById('submit');
const formError = document.getElementById('formError');

function grade() {
  let allOk = true;
  for (const [id, test] of Object.entries(RULES)) {
    const ok = test(pw.value);
    allOk = allOk && ok;
    document.querySelector('[data-rule="' + id + '"]').classList.toggle('ok', ok);
  }
  submit.disabled = !(allOk && pw2.value.length > 0);
}
pw.addEventListener('input', grade);
pw2.addEventListener('input', grade);

document.getElementById('reveal').addEventListener('click', (e) => {
  const showing = pw.type === 'text';
  pw.type = pw2.type = showing ? 'password' : 'text';
  e.target.textContent = showing ? t.show : t.hide;
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  formError.classList.add('hidden');

  if (pw.value !== pw2.value) {
    formError.textContent = t.mismatch;
    formError.classList.remove('hidden');
    return;
  }
  if (BLOCKLIST.includes(pw.value.toLowerCase())) {
    formError.textContent = t.common;
    formError.classList.remove('hidden');
    return;
  }

  submit.disabled = true;
  const { error } = await supabase.auth.updateUser({ password: pw.value });
  if (error) {
    submit.disabled = false;
    formError.textContent = error.message || t.failed;
    formError.classList.remove('hidden');
    return;
  }

  /* The recovery session existed to set one password. It has. */
  await supabase.auth.signOut();
  show('done');

  /* Offered only where a custom scheme can resolve. On a desktop it would open
     an error dialog, which is a worse ending than a sentence saying you are done. */
  if (/iphone|ipad|android/i.test(navigator.userAgent)) {
    document.getElementById('openApp').classList.remove('hidden');
  }
});

const result = await authorise();
if (!result.ok) {
  fail(result.message);
} else {
  const { data } = await supabase.auth.getUser();
  if (!data || !data.user) {
    fail('');
  } else {
    document.getElementById('forWhom').textContent = t.forWhom(data.user.email || '');
    show('form');
    pw.focus();
  }
}
</script>
</body>
</html>
